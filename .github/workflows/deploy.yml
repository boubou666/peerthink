name: Deploy

# Publishes the Vite build to GitHub Pages.
#
# Two ways in: automatically once CI has gone green on a main commit, and
# manually via workflow_dispatch — which deploys whatever the chosen ref points
# at, without waiting for CI. The manual path is the escape hatch for a broken
# Pages deployment; it is deliberately not gated.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a run finish rather than cancelling it mid-deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # a workflow_run event checks out the default branch by default, which
          # need not be the commit CI just passed — build exactly what was tested
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # npm ci and vite both run code from the checked-out ref, and this job
          # holds pages:write and id-token:write. Nothing here needs an
          # authenticated git, so don't leave the token in .git/config for it.
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4

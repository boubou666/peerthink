name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # this job runs a fork's code on pull_request; no step needs an
          # authenticated git, so the token stays out of .git/config
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser suite drives a real Chromium over the DevTools Protocol.
      - name: Locate a browser
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            sudo apt-get update && sudo apt-get install -y chromium-browser
            CHROME="$(command -v chromium-browser)"
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      # Accounts and row level security are tested against a real stack, not a
      # stand-in — so the stack has to exist here, or both suites would skip
      # and a green run would mean less than it looks like. `supabase start`
      # applies supabase/migrations on the way up, which is also what makes
      # DATABASE_URL below point at an already-migrated database.
      - name: Start Supabase
        run: |
          npx supabase start
          echo "DATABASE_URL=$(npx supabase status -o json | jq -r .DB_URL)" >> "$GITHUB_ENV"

      - name: Run tests with the coverage gate
        run: npm test
        env:
          COVERAGE_THRESHOLD: '95'

      - name: Run the row level security tests
        run: npm run test:db

      # Frees the runner's ports and containers for any later step, and keeps a
      # cancelled run from leaving the stack up on a self-hosted runner.
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

      # The suite runs against Vite's dev server so that coverage maps back to
      # real source files. This proves the artifact we actually ship builds.
      - name: Build the shipped artifact
        run: npm run build

      - name: Fail on a production advisory
        run: npm audit --omit=dev --audit-level=high

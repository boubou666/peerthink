name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests & coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # this job runs a fork's code on pull_request; no step needs an
          # authenticated git, so the token stays out of .git/config
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The browser suite drives a real Chromium over the DevTools Protocol.
      - name: Locate a browser
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$CHROME" ]; then
            sudo apt-get update && sudo apt-get install -y chromium-browser
            CHROME="$(command -v chromium-browser)"
          fi
          echo "CHROME_PATH=$CHROME" >> "$GITHUB_ENV"
          "$CHROME" --version

      # Accounts and row level security are tested against a real stack, not a
      # stand-in — so the stack has to exist here, or both suites would skip
      # and a green run would mean less than it looks like. `supabase start`
      # applies supabase/migrations on the way up, which is also what makes
      # DATABASE_URL below point at an already-migrated database.
      - name: Start Supabase
        run: |
          npx supabase start
          echo "DATABASE_URL=$(npx supabase status -o json | jq -r .DB_URL)" >> "$GITHUB_ENV"

      - name: Run tests with the coverage gate
        run: npm test
        env:
          COVERAGE_THRESHOLD: '95'

      - name: Run the row level security tests
        run: npm run test:db

      # Frees the runner's ports and containers for any later step, and keeps a
      # cancelled run from leaving the stack up on a self-hosted runner.
      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup

      # The suite runs against Vite's dev server so that coverage maps back to
      # real source files. This proves the artifact we actually ship builds.
      - name: Build the shipped artifact
        run: npm run build

      - name: Fail on a production advisory
        run: npm audit --omit=dev --audit-level=high

  # The README says the policies can be tested against any Postgres, and until
  # this job existed nothing checked that. They could not: the broadcast
  # migration failed on a bare database with `schema "realtime" does not
  # exist`, and the only path anyone exercised was the one with Docker under
  # it. A promise about the setup people fall back to is worth exactly what
  # tests it — so this runs the same suite against plain Postgres, with the
  # stub standing in for what a hosted project would have provided.
  bare-postgres:
    name: RLS against a bare Postgres
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without this the first connection races the server's own startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # --stub because the target has none of Supabase's surface. This is the
      # step that used to fail, and it fails loudly: apply() names the
      # migration that threw.
      - name: Install the Supabase surface, then the migrations
        run: node test/db/apply.js --stub

      - name: Run the row level security tests
        run: npm run test:db

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>PeerThink</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23ffe98a'/%3E%3Crect x='7' y='9' width='18' height='3' rx='1.5' fill='%231c1b19'/%3E%3Crect x='7' y='15' width='13' height='3' rx='1.5' fill='%231c1b19'/%3E%3Crect x='7' y='21' width='16' height='3' rx='1.5' fill='%231c1b19'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="stage">
    <div id="bg"></div>
    <div id="layer"></div>
    <div id="overlay"></div>
  </div>

  <div id="toolbar">
    <button data-add="card" title="New card (C)">Card</button>
    <button data-add="envelope" title="New envelope (E)">Envelope</button>
    <button data-add="list" title="New list (L)">List</button>
    <span class="sep"></span>
    <button data-act="undo" title="Undo (Ctrl+Z)">↶</button>
    <button data-act="redo" title="Redo (Ctrl+Shift+Z)">↷</button>
    <span class="sep"></span>
    <button data-act="fit" title="Zoom to fit (Shift+1)">Fit</button>
    <button data-act="reset" title="Reset zoom (Shift+0)"><span id="zoom">100%</span></button>
  </div>

  <div id="hint">
    drag empty space to select · space or middle-drag to pan · ⌘/ctrl+wheel to zoom · double-click to edit
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
